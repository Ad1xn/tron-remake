<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRON — Arena (Aufnahmen)</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <!-- Nur die Bedienleiste. Alles andere kommt aus style.css, damit die
       Arena automatisch mitzieht, wenn die Optik dort weiterentwickelt
       wird. -->
  <style>
    .bar {
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      justify-content: center; padding: .55rem .8rem;
      font: 800 .78rem/1 Nunito, system-ui, sans-serif;
      color: #9fb4ff; letter-spacing: .04em;
    }
    .bar button, .bar select, .bar input[type=range] {
      font: inherit; color: #cfe0ff;
      background: #0b1230; border: 1px solid #1d2c5e; border-radius: .5rem;
      padding: .38rem .6rem; cursor: pointer;
    }
    .bar button { background: #0d1636; min-width: 2.4rem; }
    .bar button:hover { background: #17255a; color: #fff; }
    .bar select { background: #0d1636; max-width: 24rem; }
    .bar input[type=range] { padding: 0; width: 8rem; cursor: grab; }
    .bar #scrub { width: min(30rem, 60vw); }
    .bar .sep { width: 1px; height: 1.3rem; background: #1d2c5e; margin: 0 .3rem; }
    .bar .dim { color: #5c6fa8; font-weight: 700; }
    .bar label { display: flex; gap: .35rem; align-items: center; cursor: pointer; }
    .meta { text-align: center; color: #5c6fa8; font: 700 .74rem/1.5 Nunito, sans-serif; }
    .meta b { color: #9fb4ff; }
  </style>
</head>
<body>

  <!-- Dieselben ids wie in index.html, damit src/hud.js unverändert
       funktioniert — nur die Beschriftungen bedeuten hier etwas anderes. -->
  <header class="hudbar">
    <div class="chip">
      <span class="label">TICK</span>
      <span class="value gold" id="score-value">0</span>
    </div>

    <div class="middle">
      <div class="chip">
        <span class="label">BAND</span>
        <span class="value" id="band-value">–</span>
      </div>
      <div class="dots" id="rider-dots"></div>
    </div>

    <div class="chip">
      <span class="label">LÄNGE</span>
      <span class="value gold" id="best-value">0</span>
    </div>
  </header>

  <div class="stage">
    <canvas id="board"></canvas>

    <div id="overlay" class="overlay">
      <p class="title" id="overlay-title">ARENA</p>
      <p class="text"  id="overlay-text">Aufnahmen werden geladen …</p>
      <p class="hint"  id="overlay-hint">Leertaste = abspielen</p>
    </div>
  </div>

  <!-- Dieselben Messer wie im Spiel, damit man beim Zusehen erkennt,
       wer wie viel Gummi verbraucht und wie schnell gefahren wird. -->
  <div class="meters">
    <div class="meter">
      <span class="name">RUBBER</span>
      <span class="track"><i class="fill" id="rubber-bar" style="width:100%"></i></span>
      <span class="num" id="rubber-value">0.0</span>
    </div>
    <div class="meter">
      <span class="name">SPEED</span>
      <span class="track"><i class="fill" id="speed-bar" style="width:20%"></i></span>
      <span class="num"><span id="speed-value">30</span></span>
    </div>
    <div class="meter">
      <span class="name">BRAKES</span>
      <span class="track"><i class="fill" id="brake-bar" style="width:100%"></i></span>
      <span class="num">&nbsp;</span>
    </div>
  </div>

  <div class="bar">
    <button id="prev"    title="vorheriges Band (P)">⏮</button>
    <button id="back"    title="ein Tick zurück (←)">◀</button>
    <button id="play"    title="abspielen / anhalten (Leertaste)">▶</button>
    <button id="step"    title="ein Tick vor (→)">▶|</button>
    <button id="restart" title="von vorn (R)">↻</button>
    <button id="next"    title="nächstes Band (N)">⏭</button>

    <span class="sep"></span>
    <input type="range" id="scrub" min="0" max="100" value="0" title="Tick">

    <span class="sep"></span>
    <span class="dim">TEMPO</span>
    <input type="range" id="speed" min="0.25" max="8" step="0.25" value="1">
    <span id="speed-label">1×</span>

    <span class="sep"></span>
    <label><input type="checkbox" id="auto" checked> AUTO</label>
    <button id="reload" title="index.json neu laden">⟳</button>
  </div>

  <div class="bar" style="padding-top:0">
    <select id="tape-select"></select>
  </div>

  <p class="meta">
    <b id="tape-label">–</b> · <span id="seed-label">–</span>
  </p>

  <footer>
    <div class="roster" id="roster"></div>
    <div class="keys">
      <span><b>Aufnehmen:</b> node tools/selfplay.mjs --matches 20 --replays out/replays</span>
      <span><b>Leertaste</b> abspielen</span>
      <span><b>← →</b> Tick</span>
      <span><b>N / P</b> Band</span>
      <span><b>C</b> Kamera</span>
      <span><b>Drag &amp; Drop</b> einzelne .json</span>
    </div>
  </footer>

  <script type="module" src="src/arena.js"></script>
</body>
</html>
